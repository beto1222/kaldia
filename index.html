<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>KALDIA</title>
    <meta name="description" content="KALDIA: reserva de pedras e boxes na CEASA, pagamento por PIX, check-in por QR Code e painel de fiscalização do pátio.">
    <meta name="theme-color" content="#122643">
    <link rel="icon" type="image/png" href="assets/img/kaldia-k.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css">
</head>

<body>
    <button type="button" class="pular" onclick="document.getElementById('conteudo').focus()">Pular para o conteúdo</button>
    <header id="topo" class="topo"></header>
    <main id="conteudo" class="conteudo" tabindex="-1"></main>
    <footer id="rodape" class="rodape"></footer>
    <div id="camadas"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <noscript>
        <p class="sem-js">O KALDIA precisa de JavaScript ativado para funcionar.</p>
    </noscript>

    <script src="assets/vendor/qrcode.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/patio.js"></script>
    <script src="assets/js/views-publico.js"></script>
    <script src="assets/js/views-produtor.js"></script>
    <script src="assets/js/views-fiscal.js"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
