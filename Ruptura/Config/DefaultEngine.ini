[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/L_CidadeMorta.L_CidadeMorta
EditorStartupMap=/Game/Maps/L_CidadeMorta.L_CidadeMorta
GlobalDefaultGameMode=/Script/Ruptura.RupturaGameMode
GameInstanceClass=/Script/Ruptura.RupturaGameInstance

[/Script/Engine.RendererSettings]
; Iluminação global e reflexos dinâmicos (Lumen, modo software para máxima compatibilidade)
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=False
r.Lumen.TraceMeshSDFs=1
r.GenerateMeshDistanceFields=True
; Sombras virtuais
r.Shadow.Virtual.Enable=1
; Nanite habilitado no projeto (aplicado a malhas importadas com Nanite ligado)
r.Nanite.ProjectEnabled=True
; Toda a iluminação é dinâmica: a fase é construída em tempo de execução
r.AllowStaticLighting=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.AntiAliasingMethod=4
r.VolumetricFog=1
r.DefaultFeature.MotionBlur=False

[/Script/NavigationSystem.NavigationSystemV1]
bAutoCreateNavigationData=True
bAllowClientSideNavigation=False

[/Script/NavigationSystem.RecastNavMesh]
; A geometria é gerada em tempo de execução, então a navmesh precisa ser dinâmica.
RuntimeGeneration=Dynamic
AgentRadius=40.000000
AgentHeight=190.000000
AgentMaxStepHeight=45.000000
TileSizeUU=1000.000000
CellSize=20.000000
CellHeight=10.000000

